spring:
  application:
    name: beansprout-sample
  # Requests run on virtual threads. Beansprout works either way. This is the app's own choice.
  threads:
    virtual:
      enabled: true

# Everything here is optional. Without it the blog is called "Blog" and lives at /blog.
beansprout:
  title: Beansprout Notes
  description: A sample blog, served by the Beansprout starter.
  author: Beansprout
  photo: /images/beansprout.png

# This app also uses JTE for its own pages, and JTE will not start until you choose: compile
# templates on the fly (development) or load precompiled ones (production). Beansprout's theme
# does not need this setting. It ships its templates precompiled and uses its own engine.
gg:
  jte:
    development-mode: true
