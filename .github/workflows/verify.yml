name: verify

# The same gate the agent hooks run locally, where nobody can skip it.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

      # Evidence from the sitemap crawl in beansprout-sample (SitemapCrawlTests).
      - name: Crawl summary
        if: always()
        run: |
          summary=beansprout-sample/target/crawl/crawl-summary.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No crawl report. The build stopped before the crawl ran." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-evidence
          path: beansprout-sample/target/crawl/
          if-no-files-found: warn
