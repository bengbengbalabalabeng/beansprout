name: release

# Releases to Maven Central when a version tag such as v0.1.0 is pushed.
# The upload waits at central.sonatype.com until someone presses Publish. RELEASING.md has the steps.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Writes a settings.xml with a "central" server that reads these two variables.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Check the tag matches the version
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but pom.xml says $VERSION. Set the version first."
            exit 1
          fi
          case "$VERSION" in
            *-SNAPSHOT) echo "Snapshots are not released to Maven Central."; exit 1 ;;
          esac

      - name: Build, sign and upload
        run: ./mvnw -B -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
